        type: "contract"
        path: "tests/contract/analytics.contract.test.ts"
        test_case: "computes mandatory release-confidence snapshot metrics with formulas and guardrails"
        contexts: ["local", "pr-ci"]
      - id: "metrics-state-counts"
        type: "contract"
        path: "tests/contract/analytics.contract.test.ts"
        test_case: "counts stale, manual-only, missing, blocked, accepted, and deferred contexts"
        contexts: ["local", "pr-ci"]
      - id: "metrics-unavailable-label"
        type: "contract"
        path: "tests/contract/analytics.contract.test.ts"
        test_case: "labels non-P0/P1 vocabulary unavailable when no mapping exists"
        contexts: ["local", "pr-ci"]

  - id: "analytics-drilldown-and-baseline"
    title: "A figure can be opened up, and is only compared against a stated baseline"
    description: >-
      Any metric can be drilled into for the records behind it, with filters
      applied consistently and without altering the underlying records. A
      comparison against a previous state happens only when an explicit baseline
      is identified, so no trend is implied against an unnamed past.
    source_type: "IMPLEMENTATION"
    source_refs:
      - path: "packages/core/src/analytics/drilldowns.ts"
      - path: "packages/core/src/analytics/baselines.ts"
    category: "other"
    priority: "UNKNOWN"
    evidence:
      - id: "drilldown-selection"
        type: "contract"
        path: "tests/contract/analytics.contract.test.ts"
        test_case: "selects metric drilldowns and applies analytics filters"
        contexts: ["local", "pr-ci"]
      - id: "baseline-explicit-only"
        type: "contract"
        path: "tests/contract/analytics.contract.test.ts"
        test_case: "compares only when explicit baseline identity is present"
        contexts: ["local", "pr-ci"]
      - id: "filters-conjunctive-pure"
        type: "unit"
        path: "tests/unit/filters.test.ts"
        test_case: "applies analytics filters conjunctively without mutating records"
        contexts: ["local", "pr-ci"]
      - id: "drilldown-budget"
        type: "integration"
        path: "tests/integration/analytics.test.ts"
        test_case: "computes 1000 drilldown records under the target budget"
        contexts: ["local", "pr-ci"]
    proof_gap:
      summary: >-
        The drilldown budget check asserts a wall-clock threshold on whatever
        machine runs it, so it reports the speed of the runner as much as the
        speed of the code and can pass on a fast machine while a real regression
        goes unnoticed.
      next_step: >-
        Assert an implementation-independent bound such as record count or
        operation count alongside the timing, so a regression in algorithmic
        cost fails regardless of hardware.

  - id: "gap-classification"
    title: "Every real gap is named, and only when it is real"
    description: >-
      A check lands in each gap category that genuinely applies to it, with
      stable links back to the check it came from. Weak proof is only called weak
      when no direct passing evidence exists, and stale is only claimed when a
      source explicitly says so — never guessed from an old timestamp.
    source_type: "IMPLEMENTATION"
