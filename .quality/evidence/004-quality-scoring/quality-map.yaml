    description: >-
      The structured analysis path never marks a check as failing unless a
      runtime observation actually recorded a failure. Structural absence and
      runtime failure are different conditions and must not be conflated, or a
      project with no results would read as a project full of broken ones.
    source_type: "SOURCE"
    source_refs:
