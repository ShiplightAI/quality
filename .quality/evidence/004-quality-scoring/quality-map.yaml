  - id: "reading-never-writes"
    title: "Assessing a project never changes it or sends it anywhere"
    description: >-
      Producing any view of a project — gaps, evidence, release risk, analytics —
      reads the repository and writes nothing back, uploads nothing, and leaves
      every scanned artifact untouched. A tool pointed at someone's source tree
      to judge it must not be able to alter what it is judging.
    source_type: "SOURCE"
    source_refs:
      - path: "docs/concepts/trust-boundaries.md"
        anchor: "Read-only inspection"
      - path: "README.md"
