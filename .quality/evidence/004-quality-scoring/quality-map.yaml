  - id: "recommendations-degrade-honestly"
    title: "Losing the runtime results degrades the answer without faking it"
    description: >-
      The exported recommendations are reproducible for the same inputs. When
      runtime results cannot be fetched, the structural scores are still reported
      and the runtime ones are simply absent. Checks in scope with no matching
      observations stay listed rather than disappearing, and where results
      arrived but matched nothing, the unmatched examples are exported so the
      wiring fault is visible instead of reading as an absence of proof.
    source_type: "IMPLEMENTATION"
    source_refs:
      - path: "packages/core/src/recommendation-export/index.ts"
    category: "ops"
    priority: "UNKNOWN"
    evidence:
      - id: "export-deterministic"
        type: "contract"
        path: "tests/contract/ranked-recommendations-export.contract.test.ts"
        test_case: "builds a deterministic recommendation export for a saved observation set and view"
        contexts: ["local", "pr-ci"]
      - id: "export-static-on-runtime-failure"
        type: "contract"
        path: "tests/contract/ranked-recommendations-export.contract.test.ts"
        test_case: "still reports static structural scores when runtime acquisition fails"
        contexts: ["local", "pr-ci"]
      - id: "export-keeps-unobserved-targets"
        type: "contract"
        path: "tests/contract/ranked-recommendations-export.contract.test.ts"
        test_case: "keeps saved-view targets in recommendations when they have no matching observations"
        contexts: ["local", "pr-ci"]
      - id: "export-audit-examples"
        type: "contract"
        path: "tests/contract/ranked-recommendations-export.contract.test.ts"
        test_case: "exports resolution audit examples when loaded observations do not match evidence paths"
        contexts: ["local", "pr-ci"]
    proof_gap:
      summary: >-
        Reproducibility is asserted by one export compared against an expected
        shape in a single run. Nothing runs the same input twice and compares the
        two outputs, so a non-deterministic ordering that happens to be stable on
        one machine would satisfy this check.
      next_step: >-
        Build the export twice from identical inputs in one test and assert the
        two results are deeply equal.

  - id: "fix-prompts-name-the-real-lever"
    title: "A fix prompt says what to add, not merely that something is wrong"
    description: >-
      Prompts are generated only for checks below their target, and each one
      names the specific lever that would raise it rather than repeating a
      generic complaint. Where a check declares its own proof policy — a required
      gate, modality, or context — the prompt names that requirement. Everything,
      including already-proven checks, can be requested explicitly.
