# Reconstructed from implementation and tests. No accepted specification exists
# for this feature, so no artifact declares a priority level for any check below:
# every `priority` is UNKNOWN as a read fact, not a guess.
#
# This is the feature the product's central claim rests on — that a score is
# computed by a deterministic engine from declared facts, runtime observations,
# and recorded human decisions, and that no agent, UI, or passing test can move
# it any other way. Checks marked SOURCE trace to that written claim.
structure_provenance: "inferred_brownfield"
checks_reviewed: false
target:
  id: "004-quality-scoring"
  name: "Quality scoring and gap recommendations"
  scope: "feature"
  aliases: []
  source_refs:
    - path: "README.md"
      label: "Four measures reported separately, never blended into one number"
    - path: "AGENTS.md"
      label: "Scores computed by the engine; agents must not set ratification fields"
    - path: "docs/concepts/trust-boundaries.md"
      label: "Deterministic scores and human decisions"

expectations:
  - id: "evidence-confidence-rubric"
    title: "Proof strength is derived from what the proof is, never from an opinion"
    description: >-
      How strongly a check is proven follows one published rubric applied to the
      evidence types attached to it: an automated proof running in a gate, or two
      distinct automated proofs, reads HIGH; a single ungated automated proof
      reads MEDIUM; manual-only reads MANUAL at LOW; anything merely supporting
      reads IMPLICIT at LOW; nothing at all reads NOT COVERED. Nobody types a
      confidence level in.
    source_type: "IMPLEMENTATION"
    source_refs:
      - path: "packages/core/src/quality-structure/assessment.ts"
    category: "other"
    priority: "UNKNOWN"
    evidence:
      - id: "rubric-gate-high"
        type: "unit"
        path: "tests/unit/expectation-assessment.test.ts"
        test_case: "treats an automated type in a gate context as COVERED with HIGH confidence"
        contexts: ["local", "pr-ci"]
      - id: "rubric-two-automated-high"
        type: "unit"
        path: "tests/unit/expectation-assessment.test.ts"
        test_case: "treats two distinct ungated automated types as COVERED with HIGH confidence"
        contexts: ["local", "pr-ci"]
      - id: "rubric-single-automated-medium"
        type: "unit"
        path: "tests/unit/expectation-assessment.test.ts"
        test_case: "treats a single ungated automated type as COVERED with MEDIUM confidence"
        contexts: ["local", "pr-ci"]
      - id: "rubric-manual-low"
        type: "unit"
        path: "tests/unit/expectation-assessment.test.ts"
        test_case: "treats manual-only evidence as MANUAL with LOW confidence"
        contexts: ["local", "pr-ci"]
      - id: "rubric-supporting-implicit"
        type: "unit"
        path: "tests/unit/expectation-assessment.test.ts"
        test_case: "treats non-automated supporting evidence as IMPLICIT with LOW confidence"
        contexts: ["local", "pr-ci"]
      - id: "rubric-none-not-covered"
        type: "unit"
        path: "tests/unit/expectation-assessment.test.ts"
        test_case: "treats no evidence as NOT COVERED with LOW confidence"
        contexts: ["local", "pr-ci"]
      - id: "rubric-tier-classification"
        type: "unit"
        path: "tests/unit/expectation-assessment.test.ts"
        test_case: "classifies automated evidence types as automated"
        contexts: ["local", "pr-ci"]
      - id: "rubric-type-case-insensitive"
        type: "unit"
        path: "tests/unit/expectation-assessment.test.ts"
        test_case: "is case-insensitive"
        contexts: ["local", "pr-ci"]

  - id: "accepted-risk-stays-visible"
    title: "Accepting a risk stops it nagging without pretending it was fixed"
    description: >-
      When a person accepts a gap as tolerated risk, it stops counting as open
      and stops dragging the score, but the honest status and evidence
      confidence are left untouched, so the gap stays visible to anyone reading.
      Accepting a category that does not apply to a check changes nothing.
    source_type: "IMPLEMENTATION"
    source_refs:
      - path: "packages/core/src/quality-structure/assessment.ts"
    category: "compliance"
    priority: "UNKNOWN"
    evidence:
      - id: "accepted-missing"
        type: "unit"
        path: "tests/unit/expectation-assessment.test.ts"
        test_case: "accepting 'missing' lifts scoreStatus to COVERED while status/confidence stay honest"
        contexts: ["local", "pr-ci"]
      - id: "accepted-manual-only"
        type: "unit"
        path: "tests/unit/expectation-assessment.test.ts"
        test_case: "accepting 'manual-only' lifts scoreStatus for manual-only evidence"
        contexts: ["local", "pr-ci"]
      - id: "accepted-weak"
        type: "unit"
        path: "tests/unit/expectation-assessment.test.ts"
        test_case: "accepting 'weak' lifts scoreStatus for weak (implicit) evidence"
        contexts: ["local", "pr-ci"]
      - id: "accepted-non-matching"
        type: "unit"
        path: "tests/unit/expectation-assessment.test.ts"
        test_case: "a non-matching acceptance does not lift scoreStatus"
        contexts: ["local", "pr-ci"]
      - id: "accepted-none"
        type: "unit"
        path: "tests/unit/expectation-assessment.test.ts"
        test_case: "scoreStatus equals status when nothing is accepted"
        contexts: ["local", "pr-ci"]

  - id: "structure-confidence-origin-ladder"
    title: "Unattested structure earns no trust"
    description: >-
      How much the check list itself can be trusted follows its declared origin,
      resolved from the map default or a per-check override. A check that
      declares no origin still counts toward the score and contributes zero
      rather than being quietly excluded, so a map cannot raise its structure
      confidence by staying silent.
    source_type: "IMPLEMENTATION"
    source_refs:
      - path: "packages/core/src/quality-structure/assessment.ts"
      - path: "packages/core/src/workspace/project-evidence-scores.ts"
    category: "compliance"
    priority: "UNKNOWN"
    evidence:
      - id: "origin-resolution"
        type: "contract"
        path: "tests/contract/structure-provenance.contract.test.ts"
        test_case: "resolves provenance from map default, per-expectation override, and explicit unspecified"
        contexts: ["local", "pr-ci"]
      - id: "origin-unspecified-counts-zero"
        type: "contract"
        path: "tests/contract/structure-provenance.contract.test.ts"
        test_case: "scores structure confidence separately, counting an unspecified check as zero"
        contexts: ["local", "pr-ci"]
      - id: "origin-all-unspecified-rollup"
        type: "contract"
        path: "tests/contract/structure-provenance.contract.test.ts"
        test_case: "rolls up to 0 / UNSPECIFIED when every check is unspecified"
        contexts: ["local", "pr-ci"]
      - id: "origin-per-check-labels"
        type: "contract"
        path: "tests/contract/structure-provenance.contract.test.ts"
        test_case: "derives structure confidence labels per quality check in the owner view"
        contexts: ["local", "pr-ci"]
      - id: "origin-unreviewed-fallback"
        type: "unit"
        path: "tests/unit/structure-confidence-review.test.ts"
        test_case: "falls back to the origin table when unreviewed"
        contexts: ["local", "pr-ci"]

  - id: "only-a-human-lifts-structure-confidence"
    title: "Only a person's review can raise structure confidence to full trust"
    description: >-
      A check reaches full structure confidence only when both human gates are
      clear: the feature has been accepted as real structure, and a person has
      approved its whole check list. Confirming the feature on its own does not
      do it, and the review flag is read strictly so that only a literal true
      counts. This is the mechanism behind the promise that an agent cannot
      approve its own proposals.
    source_type: "SOURCE"
    source_refs:
      - path: "AGENTS.md"
        anchor: "Agents must not set human ratification fields or accept risk for a human"
      - path: "docs/concepts/trust-boundaries.md"
        anchor: "Human decisions stay human"
    category: "compliance"
    priority: "UNKNOWN"
    evidence:
      - id: "gates-both-required"
        type: "contract"
        path: "tests/contract/structure-provenance.contract.test.ts"
        test_case: "scores by origin until both human gates clear — confirming the feature alone does not lift it"
        contexts: ["local", "pr-ci"]
      - id: "gates-lift-to-high"
        type: "contract"
        path: "tests/contract/structure-provenance.contract.test.ts"
        test_case: "lifts every check to HIGH once reviewed AND confirmed (gate 2 + gate 4)"
        contexts: ["local", "pr-ci"]
      - id: "gates-strict-flag"
        type: "contract"
        path: "tests/contract/structure-provenance.contract.test.ts"
        test_case: "parses the checks_reviewed flag strictly (only literal true counts)"
        contexts: ["local", "pr-ci"]
      - id: "gates-owner-view"
        type: "contract"
        path: "tests/contract/structure-provenance.contract.test.ts"
        test_case: "lifts owner-view per-check structure confidence to HIGH only when reviewed AND confirmed"
        contexts: ["local", "pr-ci"]
      - id: "gates-project-index-row"
        type: "contract"
        path: "tests/contract/structure-provenance.contract.test.ts"
        test_case: "lifts the project-index feature row label to HIGH only when reviewed AND confirmed"
        contexts: ["local", "pr-ci"]
      - id: "gates-review-overrides-origin"
        type: "unit"
        path: "tests/unit/structure-confidence-review.test.ts"
        test_case: "lifts any origin to HIGH (1.0) once reviewed — human opinion first"
        contexts: ["local", "pr-ci"]
      - id: "gates-candidate-unconfirmed"
        type: "unit"
        path: "tests/unit/structure-confidence-review.test.ts"
        test_case: "treats a candidate feature as unconfirmed and everything else as confirmed"
        contexts: ["local", "pr-ci"]
    proof_gap:
      summary: >-
        Every check here proves the positive direction — what a recorded human
        decision does. None proves the negative that matters most: that nothing
        else can raise structure confidence. No check asserts that ingesting
        observations, adding evidence, or a passing test run leaves it unchanged.
        The claim an agent could most easily violate is the one with no proof
        behind it.
      next_step: >-
        Add a check that scores a target, then re-scores it after attaching
        passing observations and stronger evidence, asserting structure
        confidence is identical across both.

  - id: "invalid-provenance-fails-safe"
    title: "An unrecognised origin is distrusted, not guessed at"
    description: >-
      An origin outside the accepted vocabulary produces a warning and falls back
      to untrusted rather than being interpreted. An invalid per-check value
      falls back on its own instead of silently inheriting the map's default,
      which would otherwise let a typo borrow trust from the rest of the map. An
      empty value reads as simply absent, with no warning.
    source_type: "IMPLEMENTATION"
    source_refs:
      - path: "packages/core/src/quality-structure/assessment.ts"
    category: "compliance"
    priority: "UNKNOWN"
    evidence:
      - id: "invalid-provenance-warns"
        type: "contract"
        path: "tests/contract/structure-provenance.contract.test.ts"
        test_case: "flags out-of-vocabulary provenance with a warning and falls back to unspecified"
        contexts: ["local", "pr-ci"]
      - id: "invalid-provenance-no-inherit"
        type: "contract"
        path: "tests/contract/structure-provenance.contract.test.ts"
        test_case: "forces an invalid per-expectation provenance to unspecified instead of inheriting the map default"
        contexts: ["local", "pr-ci"]
      - id: "invalid-provenance-empty"
        type: "contract"
        path: "tests/contract/structure-provenance.contract.test.ts"
        test_case: "treats an empty/whitespace structure_provenance as absent without warning"
        contexts: ["local", "pr-ci"]

  - id: "measures-stay-separate"
    title: "The four measures are never blended into one number"
    description: >-
      Structural analysis stays structural: it does not absorb a runtime
      confidence value handed to it by a source, and the owner's release view
      states risk without inventing a quality score where none was observed.
      Keeping the measures apart is what makes the next action clear — weak
      proof calls for a different response from a failing one.
    source_type: "SOURCE"
    source_refs:
      - path: "README.md"
        anchor: "Show what is uncertain"
      - path: "AGENTS.md"
        anchor: "Scores are computed by the deterministic engine, never by an agent or UI"
    category: "other"
    priority: "UNKNOWN"
    evidence:
      - id: "separate-structural-only"
        type: "contract"
        path: "tests/contract/analytics.contract.test.ts"
        test_case: "keeps analytics structural-only and does not expose source-supplied runtime confidence"
        contexts: ["local", "pr-ci"]
      - id: "separate-no-invented-score"
        type: "integration"
        path: "tests/integration/owner-view.test.ts"
        test_case: "surfaces release risk without a computed quality score"
        contexts: ["local", "pr-ci"]

  - id: "release-confidence-metrics"
    title: "Release-confidence figures come with their formula and their limits"
    description: >-
      The release snapshot computes its metrics from published formulas with
      explicit guardrails, and counts how many checks sit in each state — stale,
      manual-only, missing, blocked, accepted, deferred. Where no mapping exists
      for a priority level, the figure is labelled unavailable instead of being
      approximated.
    source_type: "IMPLEMENTATION"
    source_refs:
      - path: "packages/core/src/analytics/compute-release-snapshot.ts"
      - path: "packages/core/src/analytics/metric-definitions.ts"
    category: "other"
    priority: "UNKNOWN"
