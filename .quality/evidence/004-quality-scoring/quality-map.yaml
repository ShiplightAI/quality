  - id: "recommendations-rank-by-value"
    title: "The suggested next action is the one that would help most"
    description: >-
      Open checks are ranked by how much closing them would actually raise the
      result, so effort goes where it pays. When everything already passes,
      nothing is recommended rather than manufacturing busywork.
    source_type: "IMPLEMENTATION"
    source_refs:
      - path: "packages/core/src/observations/recommend.ts"
    category: "other"
