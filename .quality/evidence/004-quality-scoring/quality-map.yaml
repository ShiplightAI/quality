  - id: "owner-view-leads-with-priority"
    title: "The owner sees what matters most first, in their own language"
    description: >-
      The release view is ordered by declared priority and written for the person
      accountable for the release rather than the person who wrote the code.
      Checks with no declared priority sort after those that have one, so an
      undeclared item never displaces a stated P0. Where no structured target
      exists at all, a readable fallback is shown rather than an empty screen.
    source_type: "IMPLEMENTATION"
    source_refs:
      - path: "packages/core/src/owner-view/build-owner-view.ts"
      - path: "packages/core/src/owner-view/grouping.ts"
