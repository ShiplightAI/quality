# Reconstructed from implementation and tests. No accepted specification exists
# for this feature, so no artifact declares a priority level for any check below:
# every `priority` is UNKNOWN as a read fact, not a guess. The owner declaring
# priorities and reviewing this list are the two open ratification gates.
structure_provenance: "inferred_brownfield"
checks_reviewed: false
target:
  id: "003-runtime-observations"
  name: "Runtime observations"
  scope: "feature"
  aliases: []
  source_refs:
    - path: "AGENTS.md"
      label: "Independence: producers write facts, Quality reads and evaluates them"
    - path: "docs/concepts/trust-boundaries.md"
      label: "Evidence remains independent and scores are deterministic"
    - path: "packages/core/src/observations/quality-observations.schema.json"
      label: "Canonical observation manifest schema"

expectations:
  - id: "canonical-format-only"
    title: "Only the one canonical observation format is accepted"
    description: >-
      A producer publishing results has exactly one format to emit. Legacy shapes
      such as a bare array or a `test_file` alias are rejected rather than
      quietly reinterpreted, so there is no second, undocumented path by which a
      result can enter a score.
    source_type: "IMPLEMENTATION"
    source_refs:
      - path: "packages/core/src/observations/manifest.ts"
    category: "data"
    priority: "UNKNOWN"
    evidence:
      - id: "canonical-format-versioned"
        type: "contract"
        path: "tests/contract/canonical-observation-manifest.contract.test.ts"
        test_case: "accepts the single versioned workflow output format"
        contexts: ["local", "pr-ci"]
      - id: "canonical-format-rejects-legacy"
        type: "contract"
        path: "tests/contract/canonical-observation-manifest.contract.test.ts"
        test_case: "rejects legacy arrays and test_file aliases"
        contexts: ["local", "pr-ci"]
      - id: "canonical-format-envelope"
        type: "contract"
        path: "tests/contract/observation-checks.contract.test.ts"
        test_case: "accepts the versioned object-with-observations envelope"
        contexts: ["local", "pr-ci"]

  - id: "manifest-provenance-required"
    title: "Every set of observations names the revision it observed and when"
    description: >-
      A score is only meaningful against a specific build. A manifest without an
      observed revision and observation time is rejected at the boundary, so a
      reader can always tie a reported result back to the code that produced it.
    source_type: "IMPLEMENTATION"
    source_refs:
      - path: "packages/core/src/observations/manifest.ts"
    category: "data"
    priority: "UNKNOWN"
    evidence:
      - id: "provenance-required"
        type: "contract"
        path: "tests/contract/canonical-observation-manifest.contract.test.ts"
        test_case: "requires revision and observation time at the manifest boundary"
        contexts: ["local", "pr-ci"]
    proof_gap:
      summary: >-
        Provenance is enforced per manifest, but a saved observation set may
        deliberately merge profile runs from different commits without a warning.
        No check asserts that the resulting assessment tells a reader which
        revisions were mixed, so a single reported score can span commits with
        nothing surfacing that fact.
      next_step: >-
        Decide whether a mixed-revision assessment must be labelled, then add a
        check asserting the assessment carries the set of observed revisions.

  - id: "partial-ingestion-is-safe"
    title: "One malformed record never discards the usable results beside it"
    description: >-
      A single bad entry in a results file does not throw away the observations
      that parsed correctly. The unusable entries are reported as diagnostics and
      recorded in the audit, so a partially broken producer degrades visibly
      rather than silently dropping proof.
    source_type: "IMPLEMENTATION"
    source_refs:
      - path: "packages/core/src/observations/manifest.ts"
    category: "data"
    priority: "UNKNOWN"
    evidence:
      - id: "partial-skips-invalid"
        type: "contract"
        path: "tests/contract/canonical-observation-manifest.contract.test.ts"
        test_case: "warns and skips invalid entries without discarding usable observations"
        contexts: ["local", "pr-ci"]
      - id: "partial-keeps-usable"
        type: "contract"
        path: "tests/contract/observation-checks.contract.test.ts"
        test_case: "keeps usable records when neighboring entries violate the canonical contract"
        contexts: ["local", "pr-ci"]
      - id: "partial-unknown-sources-audited"
        type: "contract"
        path: "tests/contract/observation-ingestion.contract.test.ts"
        test_case: "keeps unknown proof sources in the audit without dropping the rest of the batch"
        contexts: ["local", "pr-ci"]

  - id: "unusable-input-is-explicit"
    title: "An empty or unreadable results file is an error, never silence"
    description: >-
      A manifest with no usable records, or one that is not valid JSON, produces
      an explicit diagnostic. This prevents the most dangerous failure mode for a
      quality tool: a broken producer being read as a project with nothing to
      observe.
    source_type: "IMPLEMENTATION"
    source_refs:
      - path: "packages/core/src/observations/manifest.ts"
    category: "data"
    priority: "UNKNOWN"
    evidence:
      - id: "empty-manifest-rejected"
        type: "contract"
        path: "tests/contract/canonical-observation-manifest.contract.test.ts"
        test_case: "rejects an empty manifest with an explicit no-usable-records diagnostic"
        contexts: ["local", "pr-ci"]
      - id: "invalid-json-reported"
        type: "contract"
        path: "tests/contract/observation-checks.contract.test.ts"
        test_case: "reports invalid JSON as an invalid ingestion"
        contexts: ["local", "pr-ci"]

  - id: "observation-identity"
    title: "Each observed result has a distinct, non-empty identity"
    description: >-
      An observation is identified by the proof path and optional test case, and
      that identity must not be empty. Results from different artifacts in one
      run stay distinct, and when the same identity is reported twice the worse
      status is the one kept, so a retry cannot mask a failure.
    source_type: "IMPLEMENTATION"
    source_refs:
      - path: "packages/core/src/observations/manifest.ts"
        anchor: "line 291"
    category: "data"
    priority: "UNKNOWN"
    evidence:
      - id: "identity-constraint-published"
        type: "contract"
        path: "tests/contract/canonical-observation-manifest.contract.test.ts"
        test_case: "publishes the non-empty composite observation identity constraint"
        contexts: ["local", "pr-ci"]
      - id: "identity-worse-record-kept"
        type: "contract"
        path: "tests/contract/canonical-observation-manifest.contract.test.ts"
        test_case: "keeps the whole worse record when one identity is observed twice"
        contexts: ["local", "pr-ci"]
      - id: "identity-distinct-per-artifact"
        type: "contract"
        path: "tests/contract/observation-checks.contract.test.ts"
        test_case: "gives records from different artifacts in the same run distinct observation ids"
        contexts: ["local", "pr-ci"]
      - id: "identity-case-distinct"
        type: "contract"
        path: "tests/contract/canonical-observation-manifest.contract.test.ts"
        test_case: "treats test names that differ only in case as separate identities"
        contexts: ["local", "pr-ci"]

  - id: "junit-adaptation"
    title: "JUnit results become canonical observations without losing test identity"
    description: >-
      JUnit XML from any runner is converted to canonical observations. Cases
      that share a name are told apart by their enclosing suite chain, and are
      left unqualified when the suite chain cannot separate them, so a rename or
      a second same-named test does not silently merge two results into one.
    source_type: "IMPLEMENTATION"
    source_refs:
      - path: "packages/core/src/observations/junit.ts"
    category: "data"
    priority: "UNKNOWN"
    evidence:
      - id: "junit-adapts"
        type: "contract"
        path: "tests/contract/observation-ingestion.contract.test.ts"
        test_case: "adapts JUnit XML into canonical file-backed observations"
        contexts: ["local", "pr-ci"]
      - id: "junit-suite-qualification"
        type: "contract"
        path: "tests/contract/observation-ingestion.contract.test.ts"
        test_case: "keeps same-named JUnit cases distinct by qualifying them with their suite chain"
        contexts: ["local", "pr-ci"]
      - id: "junit-bare-on-collision"
        type: "contract"
        path: "tests/contract/observation-ingestion.contract.test.ts"
        test_case: "leaves colliding JUnit cases bare when the suite prefix cannot separate them"
        contexts: ["local", "pr-ci"]
      - id: "junit-case-distinct"
        type: "contract"
        path: "tests/contract/observation-ingestion.contract.test.ts"
        test_case: "leaves JUnit cases that differ only in name case as separate observations"
        contexts: ["local", "pr-ci"]
      - id: "junit-release-artifacts"
        type: "integration"
        path: "tests/integration/observation-ingestion.test.ts"
        test_case: "combines release JUnit artifacts without over-claiming missing unit proof"
        contexts: ["local", "pr-ci"]

  - id: "playwright-adaptation"
    title: "Playwright results become canonical observations"
    description: >-
      Playwright JSON reports are converted to canonical observations and reach
      evaluation, so browser-level proof can close a check the same way any other
      proof does.
    source_type: "IMPLEMENTATION"
    source_refs:
      - path: "packages/core/src/observations/playwright-json.ts"
    category: "data"
    priority: "UNKNOWN"
    evidence:
