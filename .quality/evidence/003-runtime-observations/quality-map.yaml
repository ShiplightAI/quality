  - id: "set-composition-integrity"
    title: "An assessment's set of result sources is well formed"
    description: >-
      A saved observation set bundles several sources into one batch for a single
      assessment. Duplicate set identifiers and a source listed twice in one set
      are rejected, and a reference to a source that does not exist is reported,
      so an assessment cannot quietly run against a smaller set of results than
      the reader believes.
