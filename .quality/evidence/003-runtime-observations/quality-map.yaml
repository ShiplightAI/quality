        type: "contract"
        path: "tests/contract/observation-ingestion.contract.test.ts"
        test_case: "adapts Playwright JSON into canonical file-backed observations"
        contexts: ["local", "pr-ci"]
      - id: "playwright-evaluation-ready"
        type: "integration"
        path: "tests/integration/observation-ingestion.test.ts"
        test_case: "resolves Playwright JSON artifacts into evaluation-ready observations"
        contexts: ["local", "pr-ci"]
    proof_gap:
      summary: >-
        Both proofs run against report fixtures authored inside this repository,
        not against output captured from a real Playwright run. A change in the
        reporter's actual output shape would not fail either check.
      next_step: >-
        Pin a reporter-generated report from a known Playwright version as a
        fixture, and state which reporter versions the adapter supports.

  - id: "path-fallback-identity"
    title: "Results without a file path are still attributed"
    description: >-
      Some runners report a class or suite name but no source file. Those results
      are matched by class name instead of being dropped, so proof from such a
      runner still counts toward the check it belongs to.
    source_type: "IMPLEMENTATION"
    source_refs:
