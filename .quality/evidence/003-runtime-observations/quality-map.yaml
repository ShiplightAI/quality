  - id: "transport-only-sources"
    title: "A results source can only fetch a result, never decide it"
    description: >-
      An observation source declares where an already-determined canonical result
      file lives and nothing more. Configuration that would let a source adapt or
      reinterpret a result is rejected outright. This is the mechanism behind the
      claim that Quality cannot influence the results it grades.
    source_type: "SOURCE"
    source_refs:
