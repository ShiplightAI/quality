  - id: "human-review-reaches-the-score"
    title: "A person's review of a check list changes what the assessment reports"
    description: >-
      When a human has reviewed a feature's checks, that decision is visible in
      the per-check structure confidence of the evaluation snapshot. This is the
      path by which human ratification, and nothing else, raises structure
      confidence.
    source_type: "SOURCE"
    source_refs:
      - path: "AGENTS.md"
        anchor: "Agents must not set human validation fields or accept risk for a human"
    category: "compliance"
    priority: "UNKNOWN"
    evidence:
      - id: "review-in-snapshot"
        type: "contract"
        path: "tests/contract/observation-ingestion.contract.test.ts"
        test_case: "reflects human review in the evaluation snapshot's per-check structure confidence"
        contexts: ["local", "pr-ci"]
    proof_gap:
      summary: >-
        One check proves that a recorded review is reflected in the snapshot. No
        check proves the negative direction, that nothing other than a recorded
        human decision can raise structure confidence. Checked against
        004-quality-scoring while mapping it: that feature proves the positive
        direction thoroughly across seven checks, and does not cover the
        negative either. The gap is real and shared, not a gap in this feature's
        view of it.
      next_step: >-
        Add the check once, in 004-quality-scoring where the score is computed:
        score a target, attach passing observations and stronger evidence, and
        assert structure confidence is identical across both.
