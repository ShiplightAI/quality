        test_case: "falls back to test class names when the runtime artifact does not include a file path"
        contexts: ["local", "pr-ci"]

  - id: "check-to-result-join"
    title: "An observed result attaches to exactly the check it proves"
    description: >-
      A check pinned to a named test case matches only that case, tolerating
      differences in capitalisation and a suite prefix added by the reporter, and
      never matches an unnamed result. A check left unpinned covers its whole
      proof file. This join decides which check a pass or a failure lands on, and
      a mistake in it moves a result onto the wrong promise.
    source_type: "IMPLEMENTATION"
    source_refs:
      - path: "packages/core/src/observations/resolve.ts"
        anchor: "caseMatches"
    category: "data"
    priority: "UNKNOWN"
    evidence:
      - id: "join-pinned-distinct"
        type: "contract"
        path: "tests/contract/observation-checks.contract.test.ts"
        test_case: "joins pinned checks on the same workflow file to distinct evidence by test_case (case-insensitive)"
        contexts: ["local", "pr-ci"]
      - id: "join-unpinned-file-level"
        type: "contract"
        path: "tests/contract/observation-checks.contract.test.ts"
        test_case: "matches a file-level (unpinned) check regardless of the observation test_case"
        contexts: ["local", "pr-ci"]
      - id: "join-survives-suite-prefix"
        type: "contract"
        path: "tests/contract/observation-checks.contract.test.ts"
        test_case: "keeps a pinned check matching once the reporter qualifies the case with its suite"
        contexts: ["local", "pr-ci"]
      - id: "join-pinned-needs-case"
        type: "contract"
        path: "tests/contract/observation-checks.contract.test.ts"
        test_case: "does not match a pinned check when the observation carries no test_case"
        contexts: ["local", "pr-ci"]
      - id: "join-resolves-onto-evidence-ids"
        type: "contract"
        path: "tests/contract/observation-ingestion.contract.test.ts"
        test_case: "normalizes file-backed observations and resolves them onto structural evidence ids"
        contexts: ["local", "pr-ci"]
    proof_gap:
      summary: >-
        Ingestion deliberately keeps two test names that differ only in
        capitalisation as separate results, while the join matches
        case-insensitively, so both land on the same check. No check states which
        status then wins. The two paths also disagree by construction: a repeated
        identical identity keeps the worse status
        (packages/core/src/observations/manifest.ts:291), but two results that
        collapse onto one check at join time and share an observation time are
        ordered by comparing their observation ids
        (packages/core/src/observations/evaluate.ts:45), which is unrelated to
        status. A pass and a failure in that position resolve by name order.
      next_step: >-
        Decide the intended rule, which is most plausibly worst-status-wins to
        match the duplicate-identity rule, then add a check covering a passing and
        a failing case-twin resolving onto one piece of evidence.

  - id: "latest-result-wins"
    title: "The most recent result for a check is the one that counts"
    description: >-
      When a check has been observed several times, the assessment uses the most
      recent result within the selected context and commit. A stale earlier run
      cannot override a newer one.
    source_type: "IMPLEMENTATION"
    source_refs:
