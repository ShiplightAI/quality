        type: "integration"
        path: "tests/integration/observation-ingestion.test.ts"
        test_case: "selects the latest matching observation per evidence within a context and commit"
        contexts: ["local", "pr-ci"]

  - id: "scoring-independent-of-report-format"
    title: "The report format a producer uses cannot change a score"
    description: >-
      Evaluation accepts only normalized observations and refuses raw report
      shapes, so adding support for a new runner or reporter cannot alter how any
      existing result is scored. This is the boundary that keeps the choice of
      test tooling out of the judgment.
    source_type: "SOURCE"
    source_refs:
      - path: "docs/concepts/trust-boundaries.md"
        anchor: "Scores are deterministic"
