expectations:
  - id: "discovery-finds-the-graph"
    title: "The graph is found wherever a project keeps it"
    description: >-
      A scan locates every canonical artifact — project maps, feature quality
      maps, saved views, shared observation configuration — and ignores unrelated
      files. A project map is found even when no evidence artifacts exist beside
      it, and configuration files are recognised as configuration rather than
      being presented as things to assess.
    source_type: "IMPLEMENTATION"
    source_refs:
      - path: "packages/core/src/discovery/scan-project.ts"
      - path: "packages/core/src/discovery/scan-patterns.ts"
    category: "data"
    priority: "UNKNOWN"
    evidence:
      - id: "discovery-canonical-patterns"
        type: "integration"
        path: "tests/integration/local-project-discovery.test.ts"
        test_case: "covers every canonical FR-003 source pattern and ignores unrelated files"
        contexts: ["local", "pr-ci"]
      - id: "discovery-config-not-target"
        type: "integration"
        path: "tests/integration/local-project-discovery.test.ts"
        test_case: "discovers shared observation source profiles without turning them into feature targets"
        contexts: ["local", "pr-ci"]
      - id: "discovery-saved-views"
        type: "integration"
        path: "tests/integration/local-project-discovery.test.ts"
        test_case: "discovers saved QC views when a primary project map is present"
        contexts: ["local", "pr-ci"]
      - id: "discovery-map-without-evidence"
        type: "integration"
        path: "tests/integration/local-project-discovery.test.ts"
        test_case: "discovers project maps without requiring quality-evidence artifacts"
        contexts: ["local", "pr-ci"]

  - id: "a-partial-read-is-reported-as-partial"
    title: "What could not be read is named, and the rest still works"
    description: >-
      An unreadable directory, an unreadable file, a half-written map, or an
      artifact deleted mid-scan each produce a diagnostic while everything
      readable stays usable. Duplicate matches are reported without duplicating
      the artifact. A scan that silently returned less than it found would read
      as a project with less proof than it has.
    source_type: "IMPLEMENTATION"
    source_refs:
      - path: "packages/core/src/discovery/find-artifacts.ts"
    category: "data"
    priority: "UNKNOWN"
    evidence:
      - id: "partial-unreadable-directory"
        type: "integration"
        path: "tests/integration/local-project-discovery.test.ts"
        test_case: "keeps readable artifacts when one target directory is unreadable"
        contexts: ["local", "pr-ci"]
      - id: "partial-unreadable-files"
        type: "integration"
        path: "tests/integration/local-project-discovery.test.ts"
        test_case: "reports unreadable matched artifact files separately from unreadable directories"
        contexts: ["local", "pr-ci"]
      - id: "partial-duplicate-matches"
        type: "integration"
        path: "tests/integration/local-project-discovery.test.ts"
        test_case: "reports duplicate artifact matches without duplicating artifacts"
        contexts: ["local", "pr-ci"]
