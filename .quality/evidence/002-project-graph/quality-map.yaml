        contexts: ["local", "pr-ci"]

  - id: "refresh-reflects-reality"
    title: "Re-scanning shows what is there now, not what was there before"
    description: >-
      A refresh returns a replacement snapshot covering added, removed, and
      renamed artifacts, so a deleted map disappears from the result rather than
      lingering as proof that no longer exists.
    source_type: "IMPLEMENTATION"
    source_refs:
      - path: "packages/core/src/discovery/scan-project.ts"
    category: "data"
    priority: "UNKNOWN"
    evidence:
      - id: "refresh-replacement-snapshot"
        type: "integration"
        path: "tests/integration/local-project-discovery.test.ts"
        test_case: "refresh returns a replacement snapshot for added, removed, and renamed artifacts"
        contexts: ["local", "pr-ci"]

  - id: "a-rebuild-never-destroys-a-human-decision"
    title: "Rebuilding the map never overwrites what a person decided"
    description: >-
      When the graph is rebuilt from a fresh scan, a ratified status and a
      human-set priority survive. A scan proposing a different priority raises a
      conflict instead of applying it. A feature that carried a human decision
      and is no longer found is surfaced as an orphan rather than deleted, while
      an unratified proposal is simply replaced. This is the mechanism that lets
      an agent re-run mapping without quietly undoing its owner.
    source_type: "SOURCE"
    source_refs:
      - path: "AGENTS.md"
        anchor: "Agents must not set human ratification fields or accept risk for a human"
    category: "compliance"
    priority: "UNKNOWN"
    evidence:
      - id: "merge-preserves-ratification"
        type: "unit"
        path: "tests/unit/project-map-merge.test.ts"
        test_case: "preserves ratification and human-set priority across a rebuild"
        contexts: ["local", "pr-ci"]
      - id: "merge-surfaces-conflict"
        type: "unit"
        path: "tests/unit/project-map-merge.test.ts"
        test_case: "surfaces a conflict when the scan proposes a different priority than a human-set one"
        contexts: ["local", "pr-ci"]
      - id: "merge-orphans-never-deleted"
        type: "unit"
        path: "tests/unit/project-map-merge.test.ts"
        test_case: "emits an orphan for a dropped feature that carried a human decision, never deleting it"
        contexts: ["local", "pr-ci"]
      - id: "merge-no-orphan-without-decision"
        type: "unit"
        path: "tests/unit/project-map-merge.test.ts"
        test_case: "does not orphan a dropped feature that carried no human decision"
        contexts: ["local", "pr-ci"]
      - id: "merge-replaces-unratified"
        type: "unit"
        path: "tests/unit/project-map-merge.test.ts"
        test_case: "takes the scan's status and priority for an unratified candidate"
        contexts: ["local", "pr-ci"]

  - id: "edits-are-surgical-and-attributed"
    title: "An edit changes the one thing asked for and records who asked"
    description: >-
      Writing back to the project map changes the targeted field and leaves
      comments and neighbouring content intact, so a file a person maintains by
      hand stays readable. Any priority edit stamps the priority as human-set,
      and an existing human attribution survives unrelated edits. Unknown ids are
      reported rather than applied.
    source_type: "IMPLEMENTATION"
    source_refs:
      - path: "packages/core/src/project-map/serialize.ts"
    category: "data"
    priority: "UNKNOWN"
    evidence:
      - id: "edit-preserves-comments"
        type: "unit"
        path: "tests/unit/project-map-serialize.test.ts"
        test_case: "ratifies a feature (status edit) and preserves the comment/other nodes"
        contexts: ["local", "pr-ci"]
      - id: "edit-stamps-human-priority"
        type: "unit"
        path: "tests/unit/project-map-serialize.test.ts"
        test_case: "stamps priority_provenance=human on any priority edit"
        contexts: ["local", "pr-ci"]
      - id: "edit-preserves-human-provenance"
        type: "unit"
        path: "tests/unit/project-map-serialize.test.ts"
        test_case: "preserves an existing priority_provenance: human across an unrelated status edit"
        contexts: ["local", "pr-ci"]
      - id: "edit-reports-unknown-ids"
        type: "unit"
        path: "tests/unit/project-map-serialize.test.ts"
        test_case: "reports unknown ids without applying them"
        contexts: ["local", "pr-ci"]

  - id: "check-list-edits-respect-the-gates"
    title: "Approving a check list records the approval without rewriting its origin"
    description: >-
      Applying a human's decision to a feature's check list sets the review flag
      while leaving each check's declared origin untouched, so approval is
      recorded as approval and never disguised as authorship. Proof policy and
      accepted risk are maintained as lists that can be added to and fully
      removed, and additions, removals, duplicates, and unknown ids are each
      handled explicitly rather than applied hopefully.
    source_type: "IMPLEMENTATION"
