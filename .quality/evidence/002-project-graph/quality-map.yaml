# for this feature, so no artifact declares a priority level for any check below:
# every `priority` is UNKNOWN as a read fact, not a guess.
structure_provenance: "inferred_brownfield"
checks_reviewed: false
target:
  id: "002-project-graph"
  name: "Project graph reading and safe authoring"
  scope: "feature"
  aliases: []
  source_refs:
    - path: "AGENTS.md"
      label: "Agents must not set human ratification fields or accept risk for a human"
    - path: "agent-skills/quality/references/_shared/layout.md"
