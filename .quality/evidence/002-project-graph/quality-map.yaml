  - id: "project-map-contract-holds"
    title: "What an author writes in the project map is what the engine reads"
    description: >-
      Documents declared in the map reach the engine, ordering is read from where
      the contract says it lives, and retired planning concepts stay unread. The
      skill's own template is parsed through the engine so the authoring side and
      the reading side cannot drift apart unnoticed — the failure mode this
      guards is silent discard, where a map looks complete and the data never
      arrives.
    source_type: "IMPLEMENTATION"
    source_refs:
