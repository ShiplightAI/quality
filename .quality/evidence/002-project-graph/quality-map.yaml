  - id: "author-supplied-sources-are-honoured"
    title: "Sources the scan cannot reach are read from where the author put them"
    description: >-
      Product sources a repository never mentions — a tracker project, an
      external document — are read from the author's own sources file. A
      duplicate key is reported while keeping the first entry, a supersession
      pointing at nothing is flagged, and an absent file simply means the layer
      was not used rather than an error.
    source_type: "SOURCE"
    source_refs:
      - path: "agent-skills/quality/references/_shared/layout.md"
        anchor: "config/sources.yaml is an input, not Quality output"
    category: "data"
    priority: "UNKNOWN"
    evidence:
      - id: "sources-parses"
        type: "unit"
        path: "tests/unit/sources-parse.test.ts"
        test_case: "parses a valid sources file"
        contexts: ["local", "pr-ci"]
      - id: "sources-duplicate-key"
        type: "unit"
        path: "tests/unit/sources-parse.test.ts"
        test_case: "reports a duplicate-key diagnostic and keeps the first entry"
        contexts: ["local", "pr-ci"]
      - id: "sources-dangling-supersession"
        type: "unit"
        path: "tests/unit/sources-parse.test.ts"
        test_case: "flags a superseded source whose superseded_by is dangling"
        contexts: ["local", "pr-ci"]
      - id: "sources-optional-layer"
        type: "unit"
        path: "tests/unit/sources-parse.test.ts"
        test_case: "treats a missing file as an empty document (the layer is optional)"
        contexts: ["local", "pr-ci"]
    proof_gap:
      summary: >-
        The parsing of this layer is proven, but nothing proves it is ever read
        during a real mapping pass. `map-project` is documented to consume these
        entries and enrich the project map from them; no check asserts that a
        `current` entry reaches the resulting map, or that a `rejected` one does
        not. An author could fill this file in and see no effect, with every test
        still green.
      next_step: >-
        Add a check that scans a project whose sources file names a source the
        repository does not mention, and assert it appears in the project's
        document list while a rejected entry does not.

  - id: "writes-are-scoped-and-repeatable"
    title: "Writing back touches only the named files and can be run twice"
    description: >-
      Committing graph changes includes only the files named, returns the new
      revision, reports a typed error when the directory is not a repository, and
      does nothing when there is nothing to change. Anything looser and a tool
      that edits a person's repository could sweep unrelated work into a commit.
    source_type: "IMPLEMENTATION"
    source_refs:
      - path: "packages/core/src/git/commit.ts"
    category: "security"
    priority: "UNKNOWN"
    evidence:
      - id: "commit-only-named-files"
        type: "unit"
        path: "tests/unit/git-commit.test.ts"
        test_case: "commits only the named files and returns the new HEAD sha"
        contexts: ["local", "pr-ci"]
      - id: "commit-typed-not-a-repo"
        type: "unit"
        path: "tests/unit/git-commit.test.ts"
        test_case: "throws a typed not_a_repo error outside a git repository"
        contexts: ["local", "pr-ci"]
      - id: "commit-idempotent-noop"
        type: "unit"
        path: "tests/unit/git-commit.test.ts"
        test_case: "returns an idempotent no-op (committed: false) when the file has no staged change"
        contexts: ["local", "pr-ci"]
      - id: "commit-reports-staged"
        type: "unit"
        path: "tests/unit/git-commit.test.ts"
        test_case: "reports committed: true when there are staged changes"
        contexts: ["local", "pr-ci"]

  - id: "large-projects-stay-workable"
    title: "A large repository is scanned and summarized fast enough to use"
    description: >-
      A supported artifact is found within a few seconds among a thousand
      unrelated files, a full workspace builds from scanned targets, and large
      Markdown sections are previewed under bounded time. A tool too slow to open
      on a real repository is a tool nobody runs.
    source_type: "IMPLEMENTATION"
    source_refs:
      - path: "packages/core/src/discovery/find-artifacts.ts"
    category: "performance"
    priority: "UNKNOWN"
    evidence:
      - id: "scale-discovery"
        type: "integration"
        path: "tests/integration/local-project-discovery.test.ts"
        test_case: "discovers a supported artifact within five seconds alongside 1,000 unrelated files"
        contexts: ["local", "pr-ci"]
      - id: "scale-workspace-build"
        type: "integration"
        path: "tests/integration/modern-workspace.test.ts"
        test_case: "builds a dashboard and target workspace from scanned structured and Markdown targets"
        contexts: ["local", "pr-ci"]
      - id: "scale-markdown-previews"
        type: "integration"
        path: "tests/integration/markdown-fallback.test.ts"
        test_case: "preserves large sections with bounded previews under two seconds"
        contexts: ["local", "pr-ci"]
      - id: "scale-index-build"
        type: "integration"
        path: "tests/integration/project-index.test.ts"
        test_case: "builds an index from scanned structured and Markdown fallback targets"
        contexts: ["local", "pr-ci"]
    proof_gap:
      summary: >-
        These bounds are wall-clock on whatever machine runs the suite, so they
        report the runner's speed as much as the code's and can pass on fast
        hardware while a genuine complexity regression goes unnoticed.
      next_step: >-
        Add a hardware-independent bound alongside the timings, such as the
        number of filesystem reads per scan, so an algorithmic regression fails
        regardless of the machine.
