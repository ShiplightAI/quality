        type: "integration"
        path: "tests/integration/local-project-discovery.test.ts"
        test_case: "rejects missing and non-directory project paths"
        contexts: ["local", "pr-ci"]

  - id: "scanning-is-safe-and-contained"
    title: "Scanning a repository neither changes it nor escapes it"
    description: >-
      A scan writes nothing, uploads nothing, and refuses to follow a symbolic
      link that resolves outside the chosen project. The tool is pointed at
      source trees it does not own, so both halves matter: it must not alter what
      it reads, and it must not read outside what it was given.
    source_type: "SOURCE"
    source_refs:
      - path: "docs/concepts/trust-boundaries.md"
        anchor: "Read-only inspection"
      - path: "docs/concepts/trust-boundaries.md"
        anchor: "The selected project stays contained"
    category: "security"
    priority: "UNKNOWN"
    evidence:
      - id: "safe-no-upload"
        type: "integration"
        path: "tests/integration/local-project-discovery.test.ts"
        test_case: "does not call external upload APIs during scan"
        contexts: ["local", "pr-ci"]
