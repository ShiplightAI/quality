        path: "tests/integration/local-project-discovery-race.test.ts"
        test_case: "returns a partial result when an artifact disappears before canonicalization"
        contexts: ["local", "pr-ci"]
      - id: "partial-empty-and-invalid-paths"
        type: "integration"
        path: "tests/integration/local-project-discovery.test.ts"
        test_case: "returns a completed empty result with an info diagnostic"
        contexts: ["local", "pr-ci"]
