  - id: "a-link-resolves-to-what-it-named"
    title: "A saved link opens the thing it was saved for"
    description: >-
      A bookmarked feature resolves back to its canonical target, an exact id
      beats a colliding key, and an id that merely appears somewhere in a file
      path is not mistaken for a real target. When the selected target vanishes
      after a refresh the view recovers instead of showing the wrong one, and
      identical requests against different features stay separate.
