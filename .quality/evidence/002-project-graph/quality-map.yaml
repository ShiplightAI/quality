    description: >-
      The summary is built from feature quality maps, excludes standalone
      project-scope maps that would otherwise double-count, downgrades a feature
      known only from the project map, and keeps freshness structural when no
      observations have been ingested. Independent targets sharing a directory
      stay independent, and unsupported artifacts are ignored rather than
      counted.
