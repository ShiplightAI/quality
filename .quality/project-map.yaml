    - "scripts/check-spec-project-skill.sh"
    - ".github/workflows/quality-skill.yml"
    - ".github/workflows/spec-project-skill.yml"
  specs_without_implementation: []
  implementation_without_specs:
    - "Every feature in this map. No accepted per-feature intent document exists; all six were reconstructed from code and tests."
  tests_without_specs:
    - "All 62 test files. They assert current behavior with no accepted specification to compare against."
  evidence_gaps:
    - "No project emits canonical quality-observations.json, so the runtime quality score is unavailable for every feature."
    - "No proof-strategy document (TESTING.md) declares which proof modalities are required for which kind of claim."
    - "examples/ advertises example quality projects that CLI, engine, and Explorer integration tests can use, but contains only a README."
  unresolved_drift:
    - "The `agent-skills/` directory is excluded from this assessment by owner instruction, so the skill contract checks in scripts/ guard code no feature in this map covers."
