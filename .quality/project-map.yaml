# Canonical location: .quality/project-map.yaml
#
# Construction source: BROWNFIELD. This repository had no accepted per-feature
# intent document. Every feature below was reconstructed from implementation and
# tests, and is proposed as `candidate` for human ratification. Scope excludes
# `agent-skills/` by the project owner's instruction.
project:
  id: "shiplight-quality"
  name: "Shiplight Quality"
  summary: >-
    Open-source process and toolset that connects product intent to independent,
    repeatable proof. It maintains a quality graph in `.quality/`, ingests runtime
    results, and computes four separate scores deterministically so an agent or UI
    cannot invent or adjust a score by opinion. The assessment boundary is the
    published packages (`quality-map`, `quality-core`, `quality-tools`,
    `quality-ui`) and the local Quality Explorer application. The `agent-skills/`
    workflows are out of scope for this assessment.
  # No proof-strategy document exists in this repository yet.
  quality_policy_path: null
  source_refs:
    - path: "README.md"
      label: "Project README and stated principles"
    - path: "docs/architecture.md"
      label: "Package boundaries and non-negotiable constraints"
    - path: "AGENTS.md"
      label: "Repository guidance: independence and dependency direction"

product_docs:
  - id: "readme"
    path: "README.md"
    role: "project_overview"
    status: "current"
  - id: "architecture"
    path: "docs/architecture.md"
    role: "architecture"
    status: "current"
  - id: "agents"
    path: "AGENTS.md"
    role: "repository_constraints"
    status: "current"

