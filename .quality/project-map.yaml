cross_feature_concerns:
  - id: "independence-boundary"
    title: "One-directional flow between proof producers and judgment"
    status: "open"
    feature_ids:
      - "003-runtime-observations"
      - "004-quality-scoring"
      - "006-quality-presentation"
    source_refs:
      - path: "AGENTS.md"
        label: "Independence"
      - path: "docs/architecture.md"
        label: "Non-negotiable boundaries"
    notes: >-
      The product's core claim is that the systems producing proof cannot
      influence the judgment of it, and that no agent or UI can raise a human
      ratification gate. This constraint spans ingestion, scoring, and
      presentation, and no single feature owns it.

  - id: "dependency-direction"
    title: "Package dependency direction and published surface"
    status: "open"
    feature_ids:
      - "001-quality-map-contract"
      - "004-quality-scoring"
      - "005-quality-tools-cli"
      - "006-quality-presentation"
    source_refs:
      - path: "AGENTS.md"
        label: "Dependency direction"
    notes: >-
      quality-map is the lowest contract, core may depend on it, quality-tools
      bundles both, quality-ui must not import filesystem, GitHub, auth, or
      platform code, and no open-source package may depend on the Shiplight
      platform monorepo.

  - id: "no-canonical-observations"
    title: "No workflow emits canonical observations for this repository"
    status: "open"
    feature_ids:
      - "003-runtime-observations"
      - "004-quality-scoring"
    source_refs:
      - path: ".github/workflows/ci.yml"
        label: "CI runs pnpm test but serializes no result"
    notes: >-
      CI runs the suite and reports pass or fail to GitHub, but nothing writes a
      `quality-observations.json`. Until an emit step exists, this project's own
      quality score is unavailable and no estimate may be substituted. Adding the
      emit step is a producer edit that requires explicit owner authorization.

discovery:
  mode: "brownfield"
  source_types:
