name: Quality skill contracts

on:
  pull_request:
    paths:
      - ".github/workflows/quality-skill.yml"
      - ".gitignore"
      - "agent-skills/quality/**"
      - "scripts/check-quality-skill.sh"
  push:
    paths:
      - ".github/workflows/quality-skill.yml"
      - ".gitignore"
      - "agent-skills/quality/**"
      - "scripts/check-quality-skill.sh"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: scripts/check-quality-skill.sh
