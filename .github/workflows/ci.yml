name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Three parallel jobs rather than one sequential job: each gate reports its own
  # pass/fail, so a type error and a test failure surface in the same CI round
  # instead of the first one masking the second. The suite is 62 files / ~4s, so
  # there is nothing to shard.
  #
  # Every job builds first. The workspace packages resolve to their built output
  # (`@shiplightai/quality-map` types, `@shiplightai/quality-core/dist/index.js`),
  # so on a clean checkout typecheck reports 122 TS2307/TS7006 errors and the
  # suite dies on ERR_MODULE_NOT_FOUND without it. A dev machine hides this
  # because dist/ is left over from an earlier build.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Must precede setup-node: `cache: pnpm` needs the pnpm binary to resolve
      # the store path. Version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      # Reporter flags only: same `vitest run` script, same tests, same exit
      # code. Nothing here decides a result — it just also writes the run down.
      - name: Test
        run: pnpm test --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml

      # Publishes a FAILING run too — emitting only on success would feed the
      # engine a diet of green runs and bias every quality score upward, the one
      # outcome that must not happen.
      #
      # Gated on the report existing rather than `always()`: if the build step
      # failed or the job was cancelled, vitest never wrote junit.xml, and an
      # unconditional step would turn one real failure into three red steps that
      # publish nothing. `hashFiles` is empty when the file is absent.
      #
      # Runs the built CLI, not the TypeScript source: `pnpm build` above
      # already produced dist/, and `tsx` would re-transpile the whole engine
      # graph on each call. Still the repo-local build, not the published
      # 0.3.1, which predates the suite-separator handling these observations
      # need in order to resolve.
      - name: Emit canonical observations
        if: hashFiles('reports/junit.xml') != ''
        run: |
          node packages/quality-tools/dist/cli.js observations from-junit \
            reports/junit.xml \
            --output reports/quality-observations.json

      # Only `push` runs are readable: the source profile pins `branch: main`,
      # so artifacts uploaded by a pull_request run can never be selected.
      - name: Upload canonical observations
        if: hashFiles('reports/quality-observations.json') != '' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          # Exact name, not a glob. A single selector matching several artifacts
          # is rejected as ambiguous and yields zero observations; one exact name
          # per artifact is what merges.
          name: quality-observations-tests
          path: reports/quality-observations.json
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # prepublishOnly enforces this again, but CI should catch growth on the PR
      # that introduces it rather than waiting for a maintainer to publish.
      - name: Check quality-tools package size
        run: pnpm --filter @shiplightai/quality-tools check:size

      # The 1% size gate is otherwise only wired into quality-ui's
      # prepublishOnly, so a regression would surface at publish time rather
      # than on the PR that caused it. It needs the build output above.
      - name: Check published package size
        id: package-size
        run: pnpm --filter @shiplightai/quality-ui check:size

      # Serializes the outcome the step above already produced — `outcome` is
      # read, never decided here. A real failure must still be published, so
      # this is not gated on success; it is gated on `!cancelled()`, because a
      # cancelled run has no verdict to report. `always()` would run this on
      # cancellation and record the gate as failed on a commit whose gate never
      # finished, feeding the engine a fabricated failure.
      # `.quality/evidence/006-quality-presentation/quality-map.yaml` pins this
      # gate by workflow path and step name; both must keep matching.
      - name: Emit canonical observations
        if: ${{ !cancelled() && steps.package-size.outcome != 'skipped' }}
        run: |
          node packages/quality-tools/dist/cli.js observations record \
            --path .github/workflows/ci.yml \
            --test-case "Check published package size" \
            --status "${{ steps.package-size.outcome == 'success' && 'pass' || 'fail' }}" \
            --output reports/quality-observations.json

      - name: Upload canonical observations
        if: hashFiles('reports/quality-observations.json') != '' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: quality-observations-size-gate
          path: reports/quality-observations.json
          if-no-files-found: error
