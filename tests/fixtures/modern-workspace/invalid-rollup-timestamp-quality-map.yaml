target:
  id: "project"
  name: "Mapped Project"
  scope: "project"
expectations:
  - id: "freshness"
    title: "Freshness is comparable"
    description: "Freshness metadata can be compared without hiding newer evidence."
    source_type: "SOURCE"
    category: "release"
    priority: "P1"
    evidence:
      - id: "bad-timestamp"
        type: "report"
        path: "reports/bad-timestamp.md"
        contexts:
          - "local"
      - id: "fresh-timestamp"
        type: "report"
        path: "reports/fresh-timestamp.md"
        contexts:
          - "staging-gate"
    proof_gap:
      summary: "Freshness comparison needs valid timestamps."
