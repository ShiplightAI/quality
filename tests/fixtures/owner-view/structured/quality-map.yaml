    priority: "P0"
    evidence:
      - id: "covered-evidence"
        type: "contract"
        path: "tests/contract/owner-view.contract.test.ts"
        contexts:
          - "pr-ci"
          - "release-gate"
  - id: "p1-risk"
    title: "P1 risk is visible"
    description: "Residual risk is owner-readable."
    source_type: "SOURCE"
    category: "risk"
    priority: "P1"
    evidence:
      - id: "risk-evidence"
        type: "integration"
        path: "tests/integration/owner-view.test.ts"
        contexts:
          - "manual-review"
    proof_gap:
      summary: "Manual review remains open."
      next_step: "Run release review."
  - id: "unknown-priority"
    title: "Unknown priority remains visible"
    description: "Missing priority is unavailable, not hidden."
    source_type: "SOURCE"
    category: "other"
